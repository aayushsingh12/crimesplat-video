<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrimeSplat Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="topbar">
      <strong>CrimeSplat</strong>
      <span id="case-info">loading…</span>
      <label class="toggle"><input type="checkbox" id="show-path" checked /> camera path</label>
      <label class="toggle"><input type="checkbox" id="show-frustums" checked /> frames</label>
    </header>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="overlay-box"><img id="overlay" alt="" /></div>
      <div id="hint">Drag to orbit · scroll to zoom · right-drag to pan · click a surface to find source frames · click a frame marker to open it</div>
      <div id="loading">Loading splat…</div>
    </main>
    <aside id="panel" hidden>
      <div class="panel-head">
        <span id="panel-title">Source frames</span>
        <button id="panel-close" aria-label="Close">×</button>
      </div>
      <div id="frame-main">
        <div class="frame-wrap"><img id="frame-img" alt="source frame" /><div id="crosshair" hidden></div></div>
        <div class="frame-meta"><span id="frame-time"></span><button id="snap">Snap to this view</button></div>
        <label class="opacity">overlay <input type="range" id="overlay-opacity" min="0" max="1" step="0.05" value="0.5" /></label>
      </div>
      <div id="thumbs"></div>
    </aside>
    <footer id="timeline">
      <button id="play" aria-label="Play">▶</button>
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" />
      <span id="time-label">0:00.0</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
